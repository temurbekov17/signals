    box.style.left = Math.min(x1, x2) + 'px'; box.style.top = Math.min(y1, y2) + 'px';
    box.style.width = (Math.abs(x2 - x1) + 6) + 'px'; box.style.height = Math.abs(y2 - y1) + 'px';
  }
  (function loop() { upd(); requestAnimationFrame(loop); })();

  const info = document.getElementById('info');
  D.info.forEach((line, i) => { const d = document.createElement('div'); if (i === 0) d.className = 't'; d.textContent = line; info.appendChild(d); });
  const a = document.createElement('a'); a.href = D.binance; a.textContent = "Binance'da ochish"; a.target = '_blank';
  const ad = document.createElement('div'); ad.appendChild(a); info.appendChild(ad);
  window.addEventListener('resize', () => chart.applyOptions({ width: el.clientWidth, height: el.clientHeight }));
})();
